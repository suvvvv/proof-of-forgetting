# Render's free plan sleeps after 15 idle minutes; ping the live demo so judges never hit a cold start.
name: keep-live-demo-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 https://proof-of-forgetting.onrender.com/api/memories > /dev/null
